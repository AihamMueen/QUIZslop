<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUIZslop</title>
  <meta name="description" content="Practice quizzes for Python, C and JavaScript" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    try { var t = localStorage.getItem('popquiz-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>QUIZslop</span>
      </a>
      <div class="top-actions">
      <a href="#/speedrun" class="top-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span>Speedrun</span>
      </a>
      <button id="theme-toggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      </div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <!-- Quiz data: each file registers quizzes/questions with QuizBank -->
  <script src="js/bank.js"></script>
  <script src="data/original.js"></script>
  <script src="data/python-extra.js"></script>
  <script src="data/python-new.js"></script>
  <script src="data/c-extra.js"></script>
  <script src="data/c-new.js"></script>
  <script src="data/javascript-1.js"></script>
  <script src="data/javascript-2.js"></script>
  <script src="data/javascript-3.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
